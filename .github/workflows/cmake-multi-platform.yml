name: Build Blender (Linux)

on:
  push:
    branches:
      - main
      - master
      - "feature/**"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Blender on Ubuntu
    runs-on: ubuntu-latest

    steps:
      # Step 1: Shallow Clone
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      # Step 2: Install Official Ubuntu Build Dependencies + OpenCL + ccache
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            subversion \
            python3 \
            libx11-dev \
            libxxf86vm-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libxinerama-dev \
            libegl1-mesa-dev \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libdbus-1-dev \
            opencl-headers \
            ocl-icd-opencl-dev \
            gcc-14 \
            g++-14 \
            ccache

          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100 --slave /usr/bin/g++ g++ /usr/bin/g++-14
          sudo update-alternatives --set gcc /usr/bin/gcc-14

      # Step 3: Cache Precompiled SVN Libraries
      - name: Cache Blender SVN Libraries
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../lib
          key: blender-lib-linux-${{ hashFiles('build_files/cmake/platform/platform_unix.cmake') }}
          restore-keys: |
            blender-lib-linux-

      # Step 4: Cache Compiler Objects (ccache)
      - name: Cache Compiler Objects (ccache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: blender-ccache-linux-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            blender-ccache-linux-${{ github.ref_name }}-
            blender-ccache-linux-

      # Step 5: Download Precompiled Dependencies
      - name: Download Precompiled Libraries
        run: |
          make update SVN_FLAGS="--threads 4"

      # Step 6: Configure and Build Blender with Masqueraded ccache
      - name: Build Blender with OpenCL
        run: |
          # Force ccache to masquerade as the system compiler by prepending it to PATH
          export PATH="/usr/lib/ccache:$PATH"
          
          # Crucial ccache tuning for CI environments
          export CCACHE_BASEDIR="${{ github.workspace }}"
          export CCACHE_COMPRESS=true
          export CCACHE_MAXSIZE=5G
          
          # Zero out previous statistics so the log shows only this run's data
          ccache -z
          
          # Regular build execution
          make release -j2 BUILD_CMAKE_ARGS="-DWITH_CYCLES_DEVICE_OPENCL=ON"
          
          # Print cache statistics at the end to verify hits/misses
          ccache -s

      # Step 7: Package Binaries (FIXED DIRECTORY PATH)
      - name: Compress Compiled Artifacts
        run: |
          tar -czvf blender-linux-opencl.tar.gz -C ${{ github.workspace }}/../build_linux_release/bin .

      # Step 8: Upload Build Artifact
      - name: Upload Blender Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: blender-linux-opencl-build
          path: blender-linux-opencl.tar.gz
          retention-days: 7
