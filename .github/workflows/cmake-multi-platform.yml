name: Build Blender (Linux)

on:
  push:
    branches:
      - main
      - master
      - "feature/**"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Blender on Ubuntu
    runs-on: ubuntu-latest

    steps:
      # Step 1: Shallow Clone
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      # Step 2: Install Official Ubuntu Build Dependencies + OpenCL
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            subversion \
            python3 \
            libx11-dev \
            libxxf86vm-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libxinerama-dev \
            libegl1-mesa-dev \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libdbus-1-dev \
            opencl-headers \
            ocl-icd-opencl-dev

      # Step 3: Cache Precompiled Libraries (FIXED: Uses absolute path)
      - name: Cache Blender SVN Libraries
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../lib
          key: blender-lib-linux-${{ hashFiles('build_files/cmake/platform/platform_unix.cmake') }}
          restore-keys: |
            blender-lib-linux-

      # Step 4: Download Precompiled Dependencies (OPTIMIZED: Multi-threaded SVN sync)
      - name: Download Precompiled Libraries
        run: |
          make update SVN_FLAGS="--threads 4"

      # Step 5: Configure and Build Blender (OPTIMIZED: Uses all 2 CPU cores)
      - name: Build Blender with OpenCL
        run: |
          make release -j2 BUILD_CMAKE_ARGS="-DWITH_CYCLES_DEVICE_OPENCL=ON"

      # Step 6: Package Binaries
      - name: Compress Compiled Artifacts
        run: |
          tar -czvf blender-linux-opencl.tar.gz -C ${{ github.workspace }}/../build_linux/bin .

      # Step 7: Upload Build Artifact
      - name: Upload Blender Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: blender-linux-opencl-build
          path: blender-linux-opencl.tar.gz
          retention-days: 7
